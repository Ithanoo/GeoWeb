version: '3.8'

services:
  app:
    build: .
    container_name: cybergeopolitics-backend
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=cybergeopolitics
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sql:/app/sql:ro
    networks:
      - backend-network
    restart: unless-stopped

  db:
    image: postgis/postgis:15-3.3
    container_name: cybergeopolitics-db
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cybergeopolitics
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro  # ✅ Exécute automatiquement init.sql et seed.sql au 1er démarrage
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cybergeopolitics"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  backend-network:
    driver: bridge
